name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - if: matrix.os == 'ubuntu-latest'
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "5.10"
      - run: swift --version
      - run: swift build
      - run: swift test
      - run: |
          if command -v swift-format >/dev/null 2>&1; then
            swift-format lint --recursive Sources Tests
          else
            echo "swift-format not installed on this runner; skipping formatter gate."
          fi
      - if: matrix.os == 'ubuntu-latest'
        run: |
          docker build -t swift-stakeholder .
          docker run --rm swift-stakeholder --list-values
